name: chatapp
description: "WhatsApp-style 1-to-1 low-bandwidth chat — Flutter port of the Expo/RN frontend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State / storage
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Network
  http: ^1.2.2
  http_parser: ^4.0.2
  socket_io_client: ^2.0.3+1
  connectivity_plus: ^6.0.5

  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  flutter_image_compress: ^2.3.0
  video_compress: ^3.1.3
  record: ^5.1.2
  just_audio: ^0.9.40

  # WebRTC
  flutter_webrtc: ^0.11.7
  permission_handler: ^11.3.1

  # Utils
  crypto: ^3.0.5
  intl: ^0.19.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
